# CDN: reverse proxy к Minio с кешированием статических отчётов (HTML).
# Обновление кеша: Cache-Control от бэкенда (max-age=300), proxy_cache_valid 5m.
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=report_cache:10m max_size=100m inactive=1h use_temp_path=off;

server {
    listen 8080;
    server_name localhost;

    location /reports/ {
        # Path-style Minio: /bucket/key -> bucket=reports, key=reports/{hash(user_id)}/{period}.html
        rewrite ^/reports/(.*)$ /reports/reports/$1 break;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache report_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key $uri;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        return 404;
    }
}
